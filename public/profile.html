<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - LICOASS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #020617, #111827);
      color: #f8fafc;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-shell {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-panel {
      width: min(860px, 100%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(2, 6, 23, 0.45);
      overflow: hidden;
    }

    .chat-header {
      padding: 24px 32px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(2, 6, 23, 0.8);
    }

    .logo-text {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .content {
      padding: 32px;
      display: grid;
      gap: 20px;
    }

    .profile-card,
    .profile-list,
    .create-panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      padding: 24px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 12px;
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.4vw, 2.2rem);
      line-height: 1.1;
    }

    .form-message {
      margin-bottom: 16px;
      min-height: 24px;
      color: #fda4af;
      font-weight: 600;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      color: #e2e8f0;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid rgba(59, 130, 246, 0.35);
      border-color: #60a5fa;
    }

    .btn,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
    }

    .btn.secondary,
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .helper {
      margin-top: 12px;
      color: #94a3b8;
      line-height: 1.7;
    }

    .pill {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      color: #bfdbfe;
      border: 1px solid rgba(96, 165, 250, 0.24);
      font-size: 0.95rem;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .profile-row {
      display: grid;
      gap: 16px;
    }

    .profile-row strong,
    .profile-card strong {
      display: block;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .profile-value {
      color: #edf2fb;
      font-size: 1rem;
      word-break: break-word;
    }

    .profile-list ul {
      padding-left: 1.2rem;
      margin: 0;
    }

    .profile-list li {
      margin: 10px 0;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .profile-links a {
      display: block;
      color: #60a5fa;
      text-decoration: none;
      margin-top: 8px;
      word-break: break-word;
    }

    .profile-links a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel">
      <header class="chat-header">
        <div style="display:flex;align-items:center;gap:10px;"><img src="/liconr-logo.png" alt="LICOASS" style="width:36px;height:36px;border-radius:999px;object-fit:cover;margin-right:8px;" /><div class="logo-text">LICOASS Profile</div></div>
      </header>

      <div class="content">
        <div id="profile-view" class="profile-card hidden"></div>

        <div id="no-profile-view" class="profile-card hidden">
          <h1>No profile found</h1>
          <p>Please create a profile to continue. Your profile will be stored in the <code>Database/User_Profiles.json</code> file.</p>
          <div class="actions">
            <button id="show-create-form" class="btn">Create profile</button>
            <a class="btn secondary" href="index.html">Back to home</a>
          </div>
        </div>

        <div id="create-form-card" class="create-panel hidden">
          <span class="eyebrow">Create profile</span>
          <h1>Set up your account</h1>
          <div id="form-message" class="form-message" aria-live="polite"></div>
          <form id="profile-form">
            <label>
              Full Name
              <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required />
            </label>
            <label>
              Email
              <input type="email" id="email" name="email" placeholder="jane@example.com" required />
            </label>
            <label>
              Mobile Number with Country Code
              <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="+1234567890" required pattern="^\+\d{7,15}$" />
            </label>
            <input type="hidden" id="plan" name="plan" />
            <input type="hidden" id="amount" name="amount" />
            <button type="submit">Create profile and continue</button>
          </form>
          <p class="helper">Your profile will be stored in the Database/User_Profiles.json file and shown here once created.</p>
          <div id="plan-badge" class="pill"></div>
        </div>

        <div id="profile-list" class="profile-list hidden"></div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email')?.trim() || '';
    const plan = params.get('plan') || 'Mini';
    const amount = params.get('amount') || '';
    const next = params.get('next') || '';

    const profileView = document.getElementById('profile-view');
    const noProfileView = document.getElementById('no-profile-view');
    const createFormCard = document.getElementById('create-form-card');
    const profileList = document.getElementById('profile-list');
    const showCreateFormButton = document.getElementById('show-create-form');
    const createForm = document.getElementById('profile-form');
    const formMessage = document.getElementById('form-message');
    const planInput = document.getElementById('plan');
    const amountInput = document.getElementById('amount');
    const planBadge = document.getElementById('plan-badge');
    const emailField = document.getElementById('email');

    planInput.value = plan;
    amountInput.value = amount;
    planBadge.textContent = `Selected plan: ${plan}${amount ? ` · $${amount}` : ''}`;

    if (email) {
      emailField.value = email;
      emailField.readOnly = true;
    }

    function hideAllSections() {
      profileView.classList.add('hidden');
      noProfileView.classList.add('hidden');
      createFormCard.classList.add('hidden');
      profileList.classList.add('hidden');
    }

    function renderProfile(profile, allProfiles) {
      const nextStep = next === 'payment';
      profileView.innerHTML = `
        <h1>${profile.fullName || 'Your profile'}</h1>
        <p>Your profile is saved in our database folder.</p>
        <div class="profile-row">
          <div>
            <strong>Name</strong>
            <span class="profile-value">${profile.fullName || 'Not available'}</span>
          </div>
          <div>
            <strong>Email</strong>
            <span class="profile-value">${profile.email || 'Not available'}</span>
          </div>
          <div>
            <strong>Mobile Number</strong>
            <span class="profile-value">${profile.mobileNumber || 'Not available'}</span>
          </div>
          <div>
            <strong>Service</strong>
            <span class="profile-value">${profile.plan || 'Mini'}</span>
          </div>
          <div>
            <strong>Registered websites</strong>
            <div class="profile-links">
              <span class="profile-value">No registered sites found.</span>
            </div>
          </div>
          <div>
            <strong>Created</strong>
            <span class="profile-value">${new Date(profile.createdAt || Date.now()).toLocaleString()}</span>
          </div>
        </div>
        <div class="actions">
          <a class="btn secondary" href="index.html">Back to home</a>
          ${nextStep ? `<a class="btn" href="/payment.html?amount=${encodeURIComponent(amount)}&plan=${encodeURIComponent(profile.plan || plan)}&name=${encodeURIComponent(profile.fullName)}&email=${encodeURIComponent(profile.email)}">Continue to payment</a>` : ''}
        </div>
      `;

      if (Array.isArray(allProfiles) && allProfiles.length > 1) {
        profileList.innerHTML = '<h2>Saved profiles</h2><ul>' + allProfiles.map((item) => {
          return `<li><strong>${item.fullName || 'Unnamed'}</strong> — ${item.email || 'No email'} — ${item.plan || 'Mini'}</li>`;
        }).join('') + '</ul>';
        profileList.classList.remove('hidden');
      } else {
        profileList.classList.add('hidden');
      }

      hideAllSections();
      profileView.classList.remove('hidden');
    }

    function renderCreateView(allProfiles) {
      hideAllSections();
      if (email) {
        createFormCard.classList.remove('hidden');
      } else {
        noProfileView.classList.remove('hidden');
      }

      if (Array.isArray(allProfiles) && allProfiles.length > 1) {
        profileList.innerHTML = '<h2>Saved profiles</h2><ul>' + allProfiles.map((item) => {
          return `<li><strong>${item.fullName || 'Unnamed'}</strong> — ${item.email || 'No email'} — ${item.plan || 'Mini'}</li>`;
        }).join('') + '</ul>';
        profileList.classList.remove('hidden');
      }
    }

    async function loadProfiles() {
      try {
        const url = email ? `/api/user-profiles?email=${encodeURIComponent(email)}` : '/api/user-profiles';
        const response = await fetch(url);
        if (!response.ok) throw new Error('Unable to load profile');
        const data = await response.json();
        const profile = data.profile || (Array.isArray(data.profiles) ? data.profiles[data.profiles.length - 1] : null);
        if (profile) {
          renderProfile(profile, data.profiles || [profile]);
        } else {
          renderCreateView(data.profiles || []);
        }
      } catch (err) {
        hideAllSections();
        noProfileView.classList.remove('hidden');
        formMessage.textContent = 'Unable to load profiles. Please try again.';
        console.error(err);
      }
    }

    showCreateFormButton.addEventListener('click', () => {
      hideAllSections();
      createFormCard.classList.remove('hidden');
    });

    createForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      formMessage.textContent = '';

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        mobileNumber: document.getElementById('mobileNumber').value.trim(),
        plan: planInput.value
      };

      if (!payload.fullName || !payload.email || !payload.mobileNumber) {
        formMessage.textContent = 'Please complete all form fields.';
        return;
      }

      try {
        const response = await fetch('/api/user-profiles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error((data && data.details && data.details[0]) || (data && data.error) || 'Unable to save profile');
        }

        const profileUrl = new URL(window.location.href);
        profileUrl.searchParams.set('email', data.profile.email);
        profileUrl.searchParams.set('plan', data.profile.plan || plan);
        if (amount) profileUrl.searchParams.set('amount', amount);
        if (next) profileUrl.searchParams.set('next', next);
        window.location.href = profileUrl.toString();
      } catch (error) {
        formMessage.textContent = error.message || 'Unable to save profile.';
      }
    });

    document.addEventListener('DOMContentLoaded', loadProfiles);
  </script>
</body>
</html>
